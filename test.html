<!DOCTYPE html>
<html>
<head>
    <title>Test Inline Handlers</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Testing Inline Event Handlers</h1>
    
    <div>
        <button onclick="testButtonClick()">Test Button Click</button>
        <button onclick="alert('Alert works!')">Test Alert</button>
        <button onclick="showMessage('success')">Test Show Success</button>
    </div>
    
    <div id="messages"></div>
    
    <script>
        console.log('Script loaded successfully');
        
        function testButtonClick() {
            console.log('Button clicked!');
            const msg = document.getElementById('messages');
            msg.innerHTML = '<div class="message success">✓ Button click works! Onclick handlers are functioning.</div>';
        }
        
        function showMessage(type) {
            const msg = document.getElementById('messages');
            msg.innerHTML = '<div class="message ' + type + '">✓ Function call works!</div>';
        }
        
        // Test that script is running
        document.body.innerHTML += '<p>Script executed at: ' + new Date().toLocaleTimeString() + '</p>';
    </script>
</body>
</html>
